<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="brand">
    @if (collapsed()) {
      <img
        class="brand-mark"
        src="/images/MoneyLoop_Logo.png"
        alt="Aman MoneyLoop"
      />
    } @else {
      <img
        class="brand-lockup"
        [src]="language.isArabic()
          ? '/images/Moneyloop_Arabic_logo_final.png'
          : '/images/Moneyloop_English_logo_final_v2.png'"
        [alt]="language.isArabic() ? 'أمان موني لوب' : 'Aman MoneyLoop'"
      />
    }
  </div>

  <nav class="nav">
    @for (group of visibleGroups(); track group.label) {
      <div class="nav-group">
        @if (group.label && !collapsed()) {
          <span class="nav-group-label">{{ group.label }}</span>
        }
        @for (item of group.items; track item.route) {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="active"
            [pTooltip]="collapsed() ? item.label : ''"
            [tooltipPosition]="language.isArabic() ? 'left' : 'right'"
          >
            <i [class]="item.icon"></i>
            @if (!collapsed()) {
              <span>{{ item.label }}</span>
            }
          </a>
        }
      </div>
    }
  </nav>

  <div class="sidebar-footer">
    <button
      type="button"
      class="user-chip"
      (click)="sidebarUserMenu.toggle($event)"
      [attr.aria-label]="language.translate('Account')"
      [pTooltip]="collapsed() ? language.translate('Account') : ''"
      [tooltipPosition]="language.isArabic() ? 'left' : 'right'"
    >
      <div class="avatar">{{ initials() }}</div>
      @if (!collapsed()) {
        <div class="user-chip-text">
          <span class="name">{{ currentUser()?.fullName }}</span>
          <span class="role">{{ currentUser()?.roles?.[0] }}</span>
        </div>
        <i class="pi pi-chevron-up user-menu-chevron" aria-hidden="true"></i>
      }
    </button>
    <p-menu #sidebarUserMenu [model]="userMenuItems()" [popup]="true" appendTo="body" />
  </div>
</aside>
