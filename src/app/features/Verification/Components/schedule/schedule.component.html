<div class="schedule-container">
  <div class="card-box">
    <h2 class="page-title">{{ pageTitle || 'Schedule Verification' }}</h2>

    <form (ngSubmit)="onSubmit()" #scheduleForm="ngForm">
      <!-- Row 1: Application, Round, Scheduler -->
      <div class="form-row grid-3">
        <div class="form-group">
          <label>Application ID</label>
          <input type="text" [(ngModel)]="formData.applicationId" name="applicationId" [placeholder]="placeholders.applicationId" required />
        </div>

        <div class="form-group">
          <label>Verification Round</label>
          <input type="text" [(ngModel)]="formData.verificationRoundId" name="verificationRoundId" [placeholder]="placeholders.verificationRoundId" required />
        </div>

        <div class="form-group">
          <label>Scheduled By User ID</label>
          <input type="text" [(ngModel)]="formData.scheduledByUserId" name="scheduledByUserId" [placeholder]="placeholders.scheduledByUserId" required />
        </div>
      </div>

      <!-- Row 2: Date and time -->
      <div class="form-row">
        <div class="form-group">
          <label>Scheduled Date and Time</label>
          <input
            type="datetime-local"
            [(ngModel)]="formData.scheduledDateTime"
            name="scheduledDateTime"
            required
          />
        </div>

      <!-- Row 3: Location or Video Link -->
      <div class="form-group">
        <label>Location or Video Link</label>
        <input type="text" [(ngModel)]="formData.locationOrLink" name="locationOrLink" [placeholder]="placeholders.locationOrLink" required />
      </div>

      <div class="checkbox-group">
        <input
          type="checkbox"
          id="invite"
          [(ngModel)]="formData.sendCalendarInvite"
          name="sendCalendarInvite"
        />

        <label for="invite">
          Send calendar invite to member and reviewer
        </label>
      </div>

      <button
        type="submit"
        class="btn-teal"
        [disabled]="!scheduleForm.form.valid || isSubmitting"
      >
        {{ isSubmitting ? 'Scheduling...' : 'Confirm Schedule' }}
      </button>
    </form>
  </div>
</div>
