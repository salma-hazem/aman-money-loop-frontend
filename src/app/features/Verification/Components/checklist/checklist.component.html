<div class="checklist-container" *ngIf="!loadError; else errorBlock">
  <div class="header-row">
    <h2>{{ roundTitle }} - {{ memberName }}</h2>
    <span class="status-badge" [ngClass]="status ? status.toLowerCase() : ''">{{ status }}</span>
  </div>

  <div class="card-item" *ngFor="let row of criteriaRows">
    <span class="item-title">
      {{ row.criterionName }}
      <small>(weight {{ row.weight }})</small>
    </span>
    <div class="rating-group">
      <label>Rating:</label>
      <button type="button" *ngFor="let score of [1,2,3,4,5]"
              [class.active]="row.rating === score"
              (click)="setRating(row.verificationCriterionId, score)">
        {{ score }}
      </button>
    </div>
  </div>

  <div class="card-item col-flex">
    <div class="comments-section">
      <label>Reviewer Comments</label>
      <textarea [(ngModel)]="reviewerComments" placeholder="Optional comments"></textarea>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="action-footer">
    <div class="score-box">
      <strong>
        Weighted Composite Score:
        {{ calculatedCompositeScore !== null ? calculatedCompositeScore : '—' }}
      </strong>
      <small>Calculated after submission</small>
    </div>

    <button class="btn-teal" (click)="onSubmitChecklist()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Submitting...' : 'Submit Checklist' }}
    </button>
  </div>
</div>

<ng-template #errorBlock>
  <p class="error-text">{{ loadError }}</p>
</ng-template>
