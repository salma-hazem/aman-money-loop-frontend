<div class="schedule-container">
  <div class="card-box">
    <h2 class="page-title">Schedule Verification</h2>

    <form (ngSubmit)="onSubmit()" #scheduleForm="ngForm">
      <!-- Row 1: Applicant, Round, Reviewer -->
      <div class="form-row grid-3">
        <div class="form-group">
          <label>Applicant</label>
          <input type="text" [(ngModel)]="formData.applicantId" name="applicantId" placeholder="Ahmed Hassan" required />
        </div>

        <div class="form-group">
          <label>Verification Round</label>
          <input type="text" [(ngModel)]="formData.verificationRoundId" name="verificationRoundId" placeholder="Document Check" required />
        </div>

        <div class="form-group">
          <label>Reviewer</label>
          <input type="text" [(ngModel)]="formData.reviewerId" name="reviewerId" placeholder="Reviewer A" required />
        </div>
      </div>

      <!-- Row 2: Date, Time, Format -->
      <div class="form-row grid-3">
        <div class="form-group">
          <label>Date</label>
          <input type="date" [(ngModel)]="formData.scheduledDate" name="scheduledDate" required />
        </div>

        <div class="form-group">
          <label>Time</label>
          <input type="time" [(ngModel)]="formData.scheduledTime" name="scheduledTime" required />
        </div>

        <div class="form-group">
          <label>Format</label>
          <select [(ngModel)]="formData.format" name="format">
            <option value="Video">Video</option>
            <option value="In-Person">In-Person</option>
          </select>
        </div>
      </div>

      <!-- Row 3: Location or Video Link -->
      <div class="form-group">
        <label>Location or Video Link</label>
        <input type="text" [(ngModel)]="formData.locationOrLink" name="locationOrLink" placeholder="Meeting link / address" required />
      </div>

      <!-- Checkbox -->
      <div class="checkbox-group">
        <input type="checkbox" id="invite" [(ngModel)]="formData.sendCalendarInvite" name="sendCalendarInvite" />
        <label for="invite">Send calendar invite to member and reviewer</label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-teal" [disabled]="!scheduleForm.form.valid || isSubmitting">
        {{ isSubmitting ? 'Scheduling...' : 'Confirm Schedule' }}
      </button>
    </form>
  </div>
</div>
