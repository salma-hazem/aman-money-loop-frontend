<div class="checklist-container">
  <div class="header-row">
    <h2>Document Check - Ahmed Hassan</h2>
    <span class="status-badge">Scheduled</span>
  </div>

  <!-- Item 1: Document Authenticity -->
  <div class="card-item">
    <span class="item-title">Document authenticity</span>
    <div class="rating-group">
      <label>Rating:</label>
      <button type="button" *ngFor="let score of [1,2,3,4,5]"
              [class.active]="documentAuthenticityRating === score"
              (click)="setRating('authenticity', score)">
        {{ score }}
      </button>
    </div>
  </div>

  <!-- Item 2: ID Match -->
  <div class="card-item">
    <span class="item-title">ID match</span>
    <div class="rating-group">
      <label>Rating:</label>
      <button type="button" *ngFor="let score of [1,2,3,4,5]"
              [class.active]="idMatchRating === score"
              (click)="setRating('idMatch', score)">
        {{ score }}
      </button>
    </div>
  </div>

  <!-- Item 3: Completeness & Comments -->
  <div class="card-item col-flex">
    <div class="row-between">
      <span class="item-title">Completeness</span>
      <div class="rating-group">
        <label>Rating:</label>
        <button type="button" *ngFor="let score of [1,2,3,4,5]"
                [class.active]="completenessRating === score"
                (click)="setRating('completeness', score)">
          {{ score }}
        </button>
      </div>
    </div>

    <div class="comments-section">
      <label>Reviewer Comments</label>
      <textarea [(ngModel)]="reviewerComments" placeholder="Optional comments"></textarea>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="action-footer">
    <div class="score-box">
      <strong>Weighted Composite Score: {{ calculatedCompositeScore }}</strong>
      <small>Calculated after submission</small>
    </div>

    <button class="btn-teal" (click)="onSubmitChecklist()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Submitting...' : 'Submit Checklist' }}
    </button>
  </div>
</div>
